# Minimalist website — GitLab CI/CD
# Branch flow: feature -> staging -> main. Pipelines run only where they are needed:
# MR into staging  -> checks + build
# push to staging  -> build + upload the staging preview (the MR already ran the checks)
# MR staging->main -> checks + build + audit
# push to main     -> build + deploy to production (the release MR already ran the checks) + wiki sync
# Plain branch pushes start no pipeline.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

variables:
  WORKER_NAME: "minimalist-website"   # must match "name" in wrangler.jsonc

stages:
  - build
  - audit
  - deploy

default:
  image: node:24-slim
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# Checks and build in one job, so the install runs once.
build:
  stage: build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull-push   # this job refreshes the dependency cache
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        pnpm run lint
        pnpm run format:check
        pnpm run check
      fi
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Accessibility (axe on every page, both themes, both layouts) and Lighthouse.
# Merge requests into main only, once per release; with "Pipelines must succeed" it gates the merge.
audit:
  stage: audit
  needs: [build]
  # Browsers preinstalled. The tag must match @playwright/test in package.json.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
  variables:
    WRANGLER_SEND_METRICS: "false"
  script:
    - pnpm run test:a11y
    - pnpm run test:lighthouse
  artifacts:
    when: always
    paths:
      - playwright-report/
      - .lighthouseci/
    expire_in: 1 week

# One staging preview, refreshed by every merge into staging.
# Uploads a Worker version under the alias "staging" without touching production.
deploy_staging:
  stage: deploy
  needs: [build]
  interruptible: false
  resource_group: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  script:
    # The preview must never be indexed.
    # Block scalar (|): an unquoted ": " in a plain YAML list item is parsed as a mapping.
    - |
      printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
    - MSG="$(printf '%s %s' "$CI_COMMIT_SHORT_SHA" "$CI_COMMIT_TITLE" | cut -c1-90)"
    - pnpm exec wrangler versions upload --preview-alias staging --message "$MSG"
  environment:
    name: staging
    url: https://staging-$WORKER_NAME.$CF_WORKERS_SUBDOMAIN.workers.dev

deploy_production:
  stage: deploy
  needs: [build]
  interruptible: false
  resource_group: production   # never two production deploys at once
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # Without ALLOW_INDEXING=true in GitLab, production is kept out of search engines.
    - |
      if [ "$ALLOW_INDEXING" != "true" ]; then printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers; fi
    - MSG="$(printf '%s %s' "$CI_COMMIT_SHORT_SHA" "$CI_COMMIT_TITLE" | cut -c1-90)"
    - pnpm exec wrangler deploy --message "$MSG"
  environment:
    name: production
    url: $PRODUCTION_URL

# Mirrors docs/wiki/ to the GitLab wiki once production is live.
# Runs on every release, so a failed sync catches up next time. No changes, no commit.
sync_wiki:
  stage: deploy
  needs: [deploy_production]
  image: alpine:3.22
  interruptible: false
  resource_group: wiki
  cache: []
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - test -n "$WIKI_TOKEN" || { echo "WIKI_TOKEN is not set"; exit 1; }
    - apk add --no-cache git rsync
    - git clone --depth 1 "https://oauth2:${WIKI_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git" /tmp/wiki
    # .gitlab/ in the wiki repository belongs to GitLab (page redirects); keep it.
    - rsync -a --delete --exclude .git --exclude .gitlab docs/wiki/ /tmp/wiki/
    - cd /tmp/wiki
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "Wiki already up to date"
      else
        git -c user.name="$GITLAB_USER_NAME" -c user.email="$GITLAB_USER_EMAIL" commit -m "Sync wiki from $CI_COMMIT_SHORT_SHA"
        git push origin HEAD
      fi
