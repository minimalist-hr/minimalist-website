serif;font-weight:500;font-size:7px;color:#8A8880;\">minimalist.hr<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">Letterhead &nbsp;/&nbsp; A4<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- deck cover -->\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"aspect-ratio:16/9;background:#F5F4F1;border:1px solid #DCDAD3;padding:22px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div style=\"display:flex;justify-content:space-between;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">\n            <sc-if value=\"{{ showWord }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:baseline;gap:2.8px;color:#111110;\"><span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-size:10px;font-weight:500;letter-spacing:-0.03em;text-transform:none;\">MINIMALIST<\u002Fspan><span style=\"width:2px;height:2px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ markE }}\"><span style=\"width:28px;height:28px;background:#111110;color:#F5F4F1;display:flex;align-items:center;justify-content:center;font-family:Archivo,Helvetica,Arial,sans-serif;font-size:17px;font-weight:500;letter-spacing:-0.04em;text-transform:none;line-height:1;flex:none;\">M<\u002Fspan><\u002Fsc-if><span>09 / 2026<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"font-size:clamp(15px,2vw,24px);font-weight:500;letter-spacing:-0.035em;line-height:1.05;\">Core banking, rebuilt in 14 weeks<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">\n              <span style=\"width:14px;height:1px;background:#111110;\"><\u002Fspan><span>Client engagement review<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">Deck cover &nbsp;/&nbsp; 16:9<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- web hero -->\n      <div style=\"display:flex;flex-direction:column;gap:10px;grid-column:1/-1;\">\n        <div style=\"background:#FFFFFF;border:1px solid #DCDAD3;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #DCDAD3;\">\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <sc-if value=\"{{ markE }}\"><span style=\"width:22px;height:22px;background:#111110;color:#F5F4F1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;letter-spacing:-0.04em;line-height:1;flex:none;\">M<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ showWord }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:baseline;gap:3.4px;\"><span style=\"font-size:12px;font-weight:500;letter-spacing:-0.035em;color:#111110;\">MINIMALIST<\u002Fspan><span style=\"width:2.4px;height:2.4px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:20px;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">\n              <span>Work<\u002Fspan><span>Approach<\u002Fspan><span>Team<\u002Fspan><span style=\"color:#111110;\">Contact<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:clamp(32px,6vw,80px) 20px;display:flex;flex-direction:column;gap:22px;align-items:flex-start;\">\n            <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Software development &nbsp;/&nbsp; Zagreb<\u002Fdiv>\n            <div style=\"font-size:clamp(24px,4.6vw,54px);font-weight:500;letter-spacing:-0.045em;line-height:1.02;max-width:20ch;\">Complex problems. Simple solutions.<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n              <span style=\"background:#111110;color:#F5F4F1;padding:11px 18px;font-size:13px;\">Start a project<\u002Fspan>\n              <span style=\"border:1px solid #DCDAD3;padding:11px 18px;font-size:13px;color:#3B3A36;\">See the work<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">Web hero<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 08 Motion ───────────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">08<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Motion<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(28px,4vw,44px);max-width:60ch;font-size:16px;line-height:1.55;color:#3B3A36;\">Motion reveals structure, never personality. Hover each tile.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,32%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;\">\n      <div style=\"background:#F5F4F1;padding:26px;display:flex;flex-direction:column;gap:18px;cursor:default;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Reveal &nbsp;/&nbsp; 240ms<\u002Fdiv>\n        <div style=\"height:70px;display:flex;align-items:center;\">\n          <div style=\"width:30%;height:2px;background:#111110;transition:width 240ms cubic-bezier(0.2,0,0,1);\" style-hover=\"width:100%\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">cubic-bezier(.2,0,0,1) — rules and underlines extend from the left.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:26px;display:flex;flex-direction:column;gap:18px;cursor:default;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Lift &nbsp;/&nbsp; 160ms<\u002Fdiv>\n        <div style=\"height:70px;display:flex;align-items:center;\">\n          <div style=\"width:44px;height:44px;background:#111110;transition:transform 160ms cubic-bezier(0.2,0,0,1);\" style-hover=\"transform:translateY(-6px)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Translate only. No scale, no shadow bloom, no bounce.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:26px;display:flex;flex-direction:column;gap:18px;cursor:default;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">State &nbsp;/&nbsp; 120ms<\u002Fdiv>\n        <div style=\"height:70px;display:flex;align-items:center;\">\n          <div style=\"padding:11px 18px;border:1px solid #DCDAD3;font-size:13px;transition:background 120ms linear,color 120ms linear,border-color 120ms linear;\" style-hover=\"background:#111110;color:#F5F4F1;border-color:#111110\">Start a project<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Colour transitions are linear and under 150ms. Everything else is instant.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 09 Voice ────────────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:clamp(28px,4vw,44px);\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">09<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Voice &amp; messaging<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(24px,3vw,44px);margin-bottom:clamp(32px,4vw,52px);\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Rules<\u002Fdiv>\n        <ol style=\"margin:0;padding-left:18px;font-size:16px;line-height:1.7;color:#3B3A36;\">\n          <li>Quiet confidence. Never raise the voice.<\u002Fli>\n          <li>Short sentences. Precise words.<\u002Fli>\n          <li>State the fact, then stop.<\u002Fli>\n          <li>No jargon, no hype, no filler.<\u002Fli>\n          <li>Never \"passionate\", \"cutting-edge\", \"solutions-driven\".<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Say this<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#111110;\">\"We rebuild fragile systems into clean architecture, preserving everything that already works.\"<\u002Fp>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;margin-top:14px;\">Not this<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#8A8880;\">\"A passionate team delivering innovative, cutting-edge solutions that drive real business value at scale.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Boilerplate &nbsp;/&nbsp; 34 words<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3B3A36;\">Minimalist partners with ambitious companies to create software that performs at the highest level and stays simple at its core. Deliberately small, senior, and focused. No layers, no handoffs, no diluted accountability.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,46%),1fr));gap:clamp(24px,3vw,44px);border-top:1px solid #DCDAD3;padding:clamp(24px,3vw,36px) 0 clamp(32px,4vw,52px);\">\n      <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Manifesto &nbsp;/&nbsp; the long-form voice<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:56ch;font-size:16px;line-height:1.6;color:#3B3A36;text-wrap:pretty;\">\n        <p style=\"margin:0;\">Every product begins with noise. Too many features. Too many opinions. Too many ways to go wrong.<\u002Fp>\n        <p style=\"margin:0;color:#111110;\">Our work is to remove it.<\u002Fp>\n        <p style=\"margin:0;\">The best software feels inevitable, as if it could not have been built any other way. That feeling is never an accident. It is the result of disciplined thinking, deliberate design, and engineering that holds up long after launch.<\u002Fp>\n        <p style=\"margin:0;\">Complexity is easy. Anyone can add.<br>Clarity is earned. It takes judgment to know what to leave out.<\u002Fp>\n        <p style=\"margin:0;\">That judgment is what we bring.<\u002Fp>\n        <p style=\"margin:0;font-size:clamp(17px,1.8vw,22px);font-weight:500;letter-spacing:-0.03em;color:#111110;line-height:1.2;\">Less noise. Better software.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#111110;padding:clamp(32px,5vw,64px);display:flex;flex-direction:column;gap:clamp(22px,3vw,34px);\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,44%),1fr));gap:clamp(24px,3vw,40px);\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Primary tagline<\u002Fdiv>\n          <div style=\"font-size:clamp(22px,2.8vw,34px);font-weight:500;letter-spacing:-0.035em;color:#F5F4F1;line-height:1.1;\">Simple by design. Built to last.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Brand line<\u002Fdiv>\n          <div style=\"font-size:clamp(22px,2.8vw,34px);font-weight:500;letter-spacing:-0.035em;color:#F5F4F1;line-height:1.1;\">Complex problems. Simple solutions.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#2C2B28;\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Supporting lines &nbsp;/&nbsp; one per surface, never stacked<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(18px,2.4vw,32px);\">\n          <div style=\"font-size:clamp(15px,1.5vw,19px);color:#F5F4F1;line-height:1.3;\">Less noise. Better software.<\u002Fdiv>\n          <div style=\"font-size:clamp(15px,1.5vw,19px);color:#F5F4F1;line-height:1.3;\">Software without the unnecessary.<\u002Fdiv>\n          <div style=\"font-size:clamp(15px,1.5vw,19px);color:#F5F4F1;line-height:1.3;\">Your product doesn't need more. It needs better.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#2C2B28;\"><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;\">\n        <div style=\"display:flex;align-items:baseline;gap:8px;\">\n          <span style=\"display:inline-flex;align-items:baseline;gap:4.8px;color:#F5F4F1;\"><span style=\"font-size:17px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3.4px;height:3.4px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#8A8880;\">Brand identity v1.0 &nbsp;/&nbsp; minimalist.hr<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <!-- ── 10 Assets & naming ──────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-top:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;font-size:11px;\">10<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Assets &amp; naming<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(28px,4vw,44px);max-width:62ch;font-size:16px;line-height:1.55;color:#3B3A36;text-wrap:pretty;\">Master artwork lives in <span style=\"color:#111110;\">/assets<\u002Fspan>. Never redraw a mark, screenshot one out of this document, or rebuild one in a deck — export from the master or ask for the file. <a href=\"Minimalist Assets.dc.html\">Open the export sheet<\u002Fa>.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;margin-bottom:clamp(32px,4vw,48px);\">\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Naming convention<\u002Fdiv>\n        <div style=\"font-size:clamp(15px,1.5vw,19px);letter-spacing:-0.02em;color:#111110;\">minimalist-<span style=\"color:#8A8880;\">mark<\u002Fspan>-<span style=\"color:#8A8880;\">colour<\u002Fspan>.<span style=\"color:#8A8880;\">ext<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:#3B3A36;\">\n          <div><strong style=\"font-weight:500;\">mark<\u002Fstrong> — wordmark, mark, square<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">colour<\u002Fstrong> — ink or paper, named for the artwork, not the background<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">ext<\u002Fstrong> — svg, png, ico<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Lowercase, hyphens only. No version numbers, no dates, no \"final\". The folder is the version.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Which format<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:#3B3A36;\">\n          <div><strong style=\"font-weight:500;\">PNG<\u002Fstrong> — the default for anyone outside the studio. Renders identically everywhere.<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">SVG<\u002Fstrong> — for editing and for our own sites, where Archivo is already loaded.<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">ICO<\u002Fstrong> — favicon only. One file, six sizes.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Send vector only when the recipient asked for it, and outline the type first. Otherwise the PNG is the safer file.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:clamp(24px,3vw,44px);\">\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;padding-bottom:12px;\">PNG &nbsp;/&nbsp; drop-in masters<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-wordmark-ink.png<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">2331×280, transparent, trimmed. Light grounds.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-wordmark-paper.png<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">2331×280, transparent, trimmed. Dark grounds.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-mark-ink.png<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">1024×1024, ink square.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-mark-paper.png<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">1024×1024, paper square.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-square-ink.png<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">1024×1024. M alone, for 32px and below.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-square-paper.png<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">1024×1024. M alone, for ink layouts.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">favicon.ico<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">One file: M alone at 16/32, full mark 48 and up.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;padding-bottom:12px;\">SVG &nbsp;/&nbsp; editable source<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-wordmark-ink.svg<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">Wordmark, transparent.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-wordmark-paper.svg<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">Wordmark, transparent, for dark grounds.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-mark-ink.svg<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">Integrated mark, ink square.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-mark-paper.svg<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">Integrated mark, paper square.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-square-ink.svg<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">M square, ink.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:11px 0;border-top:1px solid #DCDAD3;align-items:baseline;\">\n          <span style=\"font-size:14px;letter-spacing:-0.01em;color:#111110;\">minimalist-square-paper.svg<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#8A8880;\">M square, paper.<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0;font-size:13px;line-height:1.5;color:#8A8880;\">The lettering is live type, not outlines: these need Archivo installed, and the type outlined before the file goes to a printer or any third party. If you are not editing the artwork, send the PNG.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(28px,3vw,40px);padding:clamp(22px,2.6vw,32px);border:1px solid #DCDAD3;background:#FFFFFF;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Before you send a file<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.7;color:#3B3A36;\">\n        <div>Named to the convention — a renamed file is an untracked file.<\u002Fdiv>\n        <div>Correct artwork colour for the ground it lands on, not the one on your screen.<\u002Fdiv>\n        <div>PNG unless the recipient asked for vector.<\u002Fdiv>\n        <div>If it is vector and it leaves the company, the type is outlined.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;primaryLogo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Wordmark&quot;,&quot;Integrated mark&quot;],&quot;default&quot;:&quot;Wordmark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Logo&quot;},&quot;showClearspace&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Logo&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const primary = this.props.primaryLogo ?? \"Wordmark\";\n    return {\n      isA: primary === \"Wordmark\",\n      isE: primary === \"Integrated mark\",\n      markE: primary === \"Integrated mark\",\n      showWord: primary === \"Wordmark\",\n\n      clearspaceOutline: (this.props.showClearspace ?? true) ? \"#111110\" : \"transparent\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:bor
