  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

<body>
  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #F5F4F1; }\n  * { box-sizing: border-box; }\n  a { color: #111110; text-decoration: none; border-bottom: 1px solid rgba(17,17,16,0.35); }\n  a:hover { color: #111110; border-bottom-color: #111110; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#F5F4F1;color:#111110;font-family:Archivo, Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased;width:100%;max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,64px) 96px;\">\n\n  <!-- ── Cover ───────────────────────────────────────── -->\n  <section style=\"min-height:min(92vh,860px);display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,5vw,64px) 0 clamp(32px,5vw,72px);border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;\">\n      <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;line-height:1.7;\">\n        <div>Brand Identity<\u002Fdiv>\n        <div>Version 1.0 &nbsp;/&nbsp; 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;text-align:right;line-height:1.7;\">\n        <div>minimalist.hr<\u002Fdiv>\n        <div>Internal &amp; partner use<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:clamp(24px,4vw,44px);\">\n      <div style=\"display:flex;align-items:baseline;gap:clamp(10px,1.6vw,18px);flex-wrap:wrap;\">\n        <span style=\"font-size:clamp(40px,10.4vw,132px);font-weight:500;letter-spacing:-0.045em;line-height:0.86;\">MINIMALIST<\u002Fspan>\n        <span style=\"width:clamp(8px,2.08vw,26.4px);height:clamp(8px,2.08vw,26.4px);background:currentColor;flex:none;\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <p style=\"margin:0;font-size:clamp(18px,1.9vw,26px);font-weight:500;letter-spacing:-0.03em;line-height:1.2;color:#111110;\">Complex problems. Simple solutions.<\u002Fp>\n        <p style=\"margin:0;max-width:48ch;font-size:clamp(15px,1.4vw,19px);line-height:1.55;color:#3B3A36;text-wrap:pretty;\">We design and build software that does exactly what it should, performs without friction, and stands the test of time.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#8A8880;border-top:1px solid #DCDAD3;padding-top:18px;\">\n      <div>01 &nbsp;Foundation<\u002Fdiv>\n      <div>02 &nbsp;Logo system<\u002Fdiv>\n      <div>03 &nbsp;Color<\u002Fdiv>\n      <div>04 &nbsp;Type<\u002Fdiv>\n      <div>05 &nbsp;Device &amp; icons<\u002Fdiv>\n      <div>06 &nbsp;Photography<\u002Fdiv>\n      <div>07 &nbsp;Applications<\u002Fdiv>\n      <div>08 &nbsp;Motion<\u002Fdiv>\n      <div>09 &nbsp;Voice<\u002Fdiv>\n      <div>10 &nbsp;Assets<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 01 Foundation ───────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:clamp(28px,4vw,48px);\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">01<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Foundation<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(24px,3vw,48px);\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Positioning<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;color:#111110;text-wrap:pretty;\">Minimalist is a software development studio that designs and engineers clear, reliable, and enduring digital products for companies that refuse to compromise on quality.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Principles<\u002Fdiv>\n        <ol style=\"margin:0;padding-left:18px;font-size:17px;line-height:1.65;color:#3B3A36;\">\n          <li>Purpose before features.<\u002Fli>\n          <li>Engineered to endure.<\u002Fli>\n          <li>Clarity at every layer.<\u002Fli>\n          <li>Craft without compromise.<\u002Fli>\n          <li>Honest partnership.<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Identity in one line<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.5;color:#3B3A36;text-wrap:pretty;\">One typeface, no colour, generous void. The work is the ornament.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 02 Logo system ──────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">02<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Logo system<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(28px,4vw,44px);max-width:60ch;font-size:16px;line-height:1.55;color:#3B3A36;\">Two marks, one voice. The wordmark signs; the integrated mark stands in wherever the name has to fit a square. Nothing else is sanctioned.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;\">\n\n      <!-- A -->\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,34px);display:flex;flex-direction:column;gap:28px;min-height:260px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">\n          <span>01 &nbsp;/&nbsp; Wordmark<\u002Fspan>\n          <sc-if value=\"{{ isA }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#111110;border-bottom:1px solid #111110;\">Primary<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;align-items:center;\">\n          <span style=\"display:flex;align-items:baseline;gap:clamp(6px,0.7vw,9px);\">\n            <span style=\"font-size:clamp(20px,2.4vw,30px);font-weight:500;letter-spacing:-0.04em;line-height:0.9;\">MINIMALIST<\u002Fspan>\n            <span style=\"width:clamp(4px,0.48vw,6px);height:clamp(4px,0.48vw,6px);background:currentColor;flex:none;\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8A8880;\">Tracking −4%, weight 500, closed by a square in the text colour — punctuation, not a symbol. The primary signature everywhere the name can run wide.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- E -->\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,34px);display:flex;flex-direction:column;gap:28px;min-height:260px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">\n          <span>02 &nbsp;/&nbsp; Integrated mark<\u002Fspan>\n          <sc-if value=\"{{ isE }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#111110;border-bottom:1px solid #111110;\">Primary<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;align-items:center;\">\n          <span style=\"width:clamp(104px,10vw,130px);height:clamp(104px,10vw,130px);background:#111110;color:#F5F4F1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,0.5vw,6px);flex:none;\">\n            <span style=\"font-size:clamp(52px,5vw,65px);font-weight:500;letter-spacing:-0.04em;line-height:0.85;\">M<\u002Fspan>\n            <span style=\"font-size:clamp(7.44px,0.718vw,9.25px);font-weight:500;letter-spacing:-0.005em;line-height:1;\">INIMALIST<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8A8880;\">Both elements live inside the square: the M at cap scale, INIMALIST set to exactly the M’s ink width beneath it. Self-contained — never set the full wordmark beside it. Floor 96px in layouts; below that the M square goes alone. Icons are the exception — favicons and app icons carry the full mark down to 48px.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(36px,4vw,56px);border:1px solid #DCDAD3;background:#FFFFFF;display:flex;flex-wrap:wrap;\">\n      <div style=\"flex:1 1 280px;padding:clamp(24px,3vw,34px);display:flex;flex-direction:column;gap:12px;border-right:1px solid #DCDAD3;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Which mark, where<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#3B3A36;\">The <strong style=\"font-weight:500;\">wordmark<\u002Fstrong> signs anything that can hold a horizontal line of type: site header, letterhead, deck covers, email, contracts, signage.<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#3B3A36;\">The <strong style=\"font-weight:500;\">integrated mark<\u002Fstrong> takes over wherever the layout is square or the name must fit a fixed box: avatars, app icons, favicons, merchandise, stamps on photography.<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8A8880;\">Never both on one surface. Never the integrated mark beside the wordmark.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 240px;padding:clamp(24px,3vw,34px);display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">The square<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#3B3A36;\">Sized at 20% of the wordmark's font size, baseline-aligned, set one optical space after the T. Always the same colour as the lettering.<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8A8880;\">It is part of the wordmark — never dropped, never tinted away from the text, never used on its own as a mark.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- the four sanctioned treatments -->\n    <div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;\">\n      <div style=\"background:#FFFFFF;padding:32px 26px;display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-height:200px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Wordmark / paper<\u002Fdiv>\n        <div style=\"margin:auto 0;\"><span style=\"display:inline-flex;align-items:baseline;gap:4.8px;\"><span style=\"font-size:17px;font-weight:500;letter-spacing:-0.035em;color:#111110;\">MINIMALIST<\u002Fspan><span style=\"width:3.4px;height:3.4px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#111110;padding:32px 26px;display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-height:200px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#7C7A73;\">Wordmark / inverted<\u002Fdiv>\n        <div style=\"margin:auto 0;\"><span style=\"display:inline-flex;align-items:baseline;gap:4.8px;color:#F5F4F1;\"><span style=\"font-size:17px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3.4px;height:3.4px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;padding:32px 26px;display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-height:200px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Integrated mark<\u002Fdiv>\n        <div style=\"margin:auto 0;\"><span style=\"width:96px;height:96px;background:#111110;color:#F5F4F1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.8px;flex:none;\"><span style=\"font-size:48px;font-weight:500;letter-spacing:-0.04em;line-height:0.85;\">M<\u002Fspan><span style=\"font-size:6.83px;font-weight:500;letter-spacing:-0.005em;line-height:1;\">INIMALIST<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:32px 26px;display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-height:200px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Avatar / app icon<\u002Fdiv>\n        <div style=\"margin:auto 0;\"><span style=\"width:96px;height:96px;background:#111110;color:#F5F4F1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.8px;flex:none;\"><span style=\"font-size:48px;font-weight:500;letter-spacing:-0.04em;line-height:0.85;\">M<\u002Fspan><span style=\"font-size:6.83px;font-weight:500;letter-spacing:-0.005em;line-height:1;\">INIMALIST<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:14px 0 0;font-size:13px;line-height:1.5;color:#8A8880;\">Four treatments, nothing else: the wordmark on paper and inverted, the integrated mark, and the same mark as an avatar or app icon — INIMALIST intact down to 96px. The Primary tweak decides which mark signs the applications below.<\u002Fp>\n\n    <!-- clearspace + minimum size -->\n    <div style=\"margin-top:clamp(36px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:clamp(24px,3vw,44px);\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\"><sc-if value=\"{{ showWord }}\" hint-placeholder-val=\"{{ true }}\"><span>Clearspace &nbsp;=&nbsp; one cap height of the wordmark, all sides<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ markE }}\"><span>Clearspace &nbsp;=&nbsp; 25% of the square, all sides<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #DCDAD3;padding:44px;display:flex;justify-content:center;\">\n          <div style=\"padding:11.5px;outline:1px dashed {{ clearspaceOutline }};display:flex;align-items:center;gap:10px;\">\n            <sc-if value=\"{{ markE }}\"><span style=\"width:96px;height:96px;background:#111110;color:#F5F4F1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.8px;flex:none;\"><span style=\"font-size:48px;font-weight:500;letter-spacing:-0.04em;line-height:0.85;\">M<\u002Fspan><span style=\"font-size:6.83px;font-weight:500;letter-spacing:-0.005em;line-height:1;\">INIMALIST<\u002Fspan><\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ showWord }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:baseline;gap:4.8px;\"><span style=\"font-size:17px;font-weight:500;letter-spacing:-0.035em;color:#111110;\">MINIMALIST<\u002Fspan><span style=\"width:3.4px;height:3.4px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Minimum size<\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #DCDAD3;padding:44px;display:flex;flex-direction:column;gap:24px;justify-content:center;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <span style=\"display:inline-flex;align-items:baseline;gap:4.3px;color:#111110;\"><span style=\"font-size:15.3px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3.06px;height:3.06px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan>\n            <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;color:#8A8880;\">90px / 24mm — screen &amp; print floor<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <span style=\"width:96px;height:96px;background:#111110;color:#F5F4F1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.8px;flex:none;\"><span style=\"font-size:48px;font-weight:500;letter-spacing:-0.04em;line-height:0.85;\">M<\u002Fspan><span style=\"font-size:6.83px;font-weight:500;letter-spacing:-0.005em;line-height:1;\">INIMALIST<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;color:#8A8880;\">96px / 25mm — integrated mark floor<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <span style=\"width:32px;height:32px;background:#111110;color:#F5F4F1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;letter-spacing:-0.04em;line-height:1;flex:none;\">M<\u002Fspan>\n            <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;color:#8A8880;\">32px — M square ceiling; alone at this size and below<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- don'ts -->\n    <div style=\"margin-top:clamp(36px,4vw,56px);\">\n      <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;margin-bottom:14px;\">Never<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,32%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;\">\n        <div style=\"background:#FFFFFF;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:150px;\">\n          <div style=\"flex:1;display:flex;align-items:center;\"><span style=\"display:inline-flex;align-items:baseline;gap:4.2px;\"><span style=\"font-size:15px;font-weight:500;letter-spacing:0.22em;\">MINIMALIST<\u002Fspan><span style=\"width:3px;height:3px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8880;line-height:1.45;\">Re-track the wordmark<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:150px;\">\n          <div style=\"flex:1;display:flex;align-items:center;\"><span style=\"display:inline-flex;align-items:baseline;gap:4.2px;font-style:italic;\"><span style=\"font-size:15px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3px;height:3px;background:currentColor;flex:none;transform:skewX(-12deg);\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8880;line-height:1.45;\">Slant, outline or stretch<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:150px;\">\n          <div style=\"flex:1;display:flex;align-items:center;\"><span style=\"display:inline-flex;align-items:baseline;gap:4.2px;\"><span style=\"font-size:15px;font-weight:500;letter-spacing:-0.035em;color:#8A8880;\">MINIMALIST<\u002Fspan><span style=\"width:3px;height:3px;background:#8A8880;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8880;line-height:1.45;\">Tint the mark grey or any colour<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:150px;\">\n          <div style=\"flex:1;display:flex;align-items:center;\">\n            <div style=\"padding:5px 7px;background:repeating-linear-gradient(45deg,#E6E4DE 0 6px,#F2F0EA 6px 12px);\"><span style=\"display:inline-flex;align-items:baseline;gap:4.2px;\"><span style=\"font-size:15px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3px;height:3px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8880;line-height:1.45;\">Place on busy imagery<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:150px;\">\n          <div style=\"flex:1;display:flex;align-items:center;\">\n            <span style=\"display:inline-flex;align-items:baseline;gap:1px;\"><span style=\"font-size:15px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3px;height:3px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8880;line-height:1.45;\">Close up the square's optical space<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:24px 20px;display:flex;flex-direction:column;gap:18px;min-height:150px;\">\n          <div style=\"flex:1;display:flex;align-items:center;gap:8px;\">\n            <span style=\"width:32px;height:32px;background:#111110;color:#F5F4F1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;letter-spacing:-0.04em;line-height:1;flex:none;\">M<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:baseline;gap:3px;\"><span style=\"font-size:13px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:2.6px;height:2.6px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8880;line-height:1.45;\">Set both marks together<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 03 Color ────────────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">03<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Color<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(28px,4vw,44px);max-width:60ch;font-size:16px;line-height:1.55;color:#3B3A36;\">Four neutrals, no accent. The identity carries on contrast and void alone — colour is what every other studio reaches for.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;\">\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"background:#111110;height:130px;\"><\u002Fdiv>\n        <div style=\"background:#F5F4F1;padding:16px;flex:1;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;line-height:1.8;color:#8A8880;\">\n          <div style=\"color:#111110;\">Ink<\u002Fdiv>\n          <div>#111110<\u002Fdiv>\n          <div>Text, marks, inverted fields<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"background:#F5F4F1;height:130px;border-bottom:1px solid #DCDAD3;\"><\u002Fdiv>\n        <div style=\"background:#F5F4F1;padding:16px;flex:1;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;line-height:1.8;color:#8A8880;\">\n          <div style=\"color:#111110;\">Paper<\u002Fdiv>\n          <div>#F5F4F1<\u002Fdiv>\n          <div>Default ground, 80% of surfaces<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"background:#8A8880;height:130px;\"><\u002Fdiv>\n        <div style=\"background:#F5F4F1;padding:16px;flex:1;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;line-height:1.8;color:#8A8880;\">\n          <div style=\"color:#111110;\">Graphite<\u002Fdiv>\n          <div>#8A8880<\u002Fdiv>\n          <div>Labels, metadata, captions<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"background:#DCDAD3;height:130px;\"><\u002Fdiv>\n        <div style=\"background:#F5F4F1;padding:16px;flex:1;font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;line-height:1.8;color:#8A8880;\">\n          <div style=\"color:#111110;\">Rule<\u002Fdiv>\n          <div>#DCDAD3<\u002Fdiv>\n          <div>Hairlines, dividers, grids<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(20px,3vw,40px);font-size:14px;line-height:1.6;color:#3B3A36;\">\n      <div><strong style=\"font-weight:500;\">Ratio<\u002Fstrong><br>Ink and paper hold the layout. Graphite is the only step between them; never introduce a fifth value.<\u002Fdiv>\n      <div><strong style=\"font-weight:500;\">Contrast<\u002Fstrong><br>Ink on paper 15.8:1, paper on ink the same. Graphite on paper 3.3:1 — labels and captions only, never body copy.<\u002Fdiv>\n      <div><strong style=\"font-weight:500;\">Dark mode<\u002Fstrong><br>Ink ground, paper text, graphite unchanged. Hairlines drop to #2C2B28.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 04 Typography ───────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">04<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Typography<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;margin-bottom:clamp(28px,4vw,44px);\">\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Text &nbsp;/&nbsp; Archivo 400 / 500<\u002Fdiv>\n        <div style=\"font-size:clamp(40px,6vw,76px);font-weight:500;letter-spacing:-0.04em;line-height:0.95;\">Aa<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.6;color:#3B3A36;\">Neo-grotesque, the only typeface. Weights 400 and 500; headlines tracked −2.5 to −4.5%.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Label &nbsp;/&nbsp; Archivo 500 uppercase<\u002Fdiv>\n        <div style=\"font-weight:500;font-size:clamp(30px,4.2vw,52px);line-height:0.95;letter-spacing:0.14em;\">AA<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.6;color:#3B3A36;\">Labels, metadata, numbers. Uppercase, weight 500, tracked +14%, 10–11px.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 0;border-top:1px solid #DCDAD3;flex-wrap:wrap;\">\n        <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;color:#8A8880;width:150px;flex:none;\">Display / 500 / −4.5%<\u002Fspan>\n        <span style=\"font-size:clamp(28px,4.4vw,56px);font-weight:500;letter-spacing:-0.045em;line-height:1.02;\">Built to be handed over<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 0;border-top:1px solid #DCDAD3;flex-wrap:wrap;\">\n        <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;color:#8A8880;width:150px;flex:none;\">Title / 500 / −2.5%<\u002Fspan>\n        <span style=\"font-size:clamp(20px,2.6vw,32px);font-weight:500;letter-spacing:-0.025em;\">Platform engineering, delivered in weeks<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 0;border-top:1px solid #DCDAD3;flex-wrap:wrap;\">\n        <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;color:#8A8880;width:150px;flex:none;\">Body / 400 / 17px<\u002Fspan>\n        <span style=\"font-size:17px;line-height:1.55;color:#3B3A36;max-width:52ch;\">Copy sits at 17/26 with a 52-character measure. Two sizes of body text per document, no more.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px;padding:20px 0;border-top:1px solid #DCDAD3;border-bottom:1px solid #DCDAD3;flex-wrap:wrap;\">\n        <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.12em;color:#8A8880;width:150px;flex:none;\">Label / 500 / +14%<\u002Fspan>\n        <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;\">Case study &nbsp;/&nbsp; Fintech &nbsp;/&nbsp; 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 05 Device & icons ───────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">05<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Graphic device &amp; icons<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(28px,4vw,44px);max-width:60ch;font-size:16px;line-height:1.55;color:#3B3A36;\">The device is subtraction: a hairline grid with one cell filled ink. It structures layouts and needs no illustration.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,32%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;\">\n      <div style=\"background:#F5F4F1;padding:26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Grid device<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;aspect-ratio:1;\">\n          <div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv>\n          <div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#111110;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv>\n          <div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv>\n          <div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv><div style=\"background:#F5F4F1;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Icon construction<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;\">\n          <div style=\"aspect-ratio:1;border:1.5px solid #111110;\"><\u002Fdiv>\n          <div style=\"aspect-ratio:1;border:1.5px solid #111110;border-radius:50%;\"><\u002Fdiv>\n          <div style=\"aspect-ratio:1;border:1.5px solid #111110;border-bottom-color:transparent;border-right-color:transparent;\"><\u002Fdiv>\n          <div style=\"aspect-ratio:1;display:flex;align-items:center;\"><div style=\"width:100%;height:1.5px;background:#111110;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"aspect-ratio:1;display:flex;justify-content:center;\"><div style=\"height:100%;width:1.5px;background:#111110;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"aspect-ratio:1;background:#111110;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">24px box, 1.5px stroke, square caps, no rounding except true circles.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Image treatment<\u002Fdiv>\n        <div style=\"aspect-ratio:1;background:repeating-linear-gradient(90deg,#E9E7E1 0 5px,#F2F0EA 5px 10px);display:flex;align-items:flex-end;padding:12px;\">\n          <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;color:#8A8880;\">team / workspace photo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Desaturated, flat light, square crop. Full direction in section 06.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 06 Photography ──────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:16px;\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">06<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Photography<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(28px,4vw,44px);max-width:60ch;font-size:16px;line-height:1.55;color:#3B3A36;\">Photography is the only place the brand admits texture. It documents — rooms, hands, screens, weather — and never performs. Black and white throughout, so it never competes with the type. The images below are stand-ins for treatment and crop only — the subject brief is opposite.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,29%),1fr));gap:clamp(16px,2vw,26px);margin-bottom:clamp(32px,4vw,48px);\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"aspect-ratio:4/5;background:#E9E7E1;overflow:hidden;\">\n            <img src=\"a3a3f7bf-e617-473e-9db5-e78a653d8c80\" alt=\"Placeholder — treatment reference\" style=\"width:100%;height:100%;object-fit:cover;display:block;filter:contrast(0.92) brightness(1.04);\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">4:5 portrait<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">The default crop. Used in case studies and team pages.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"aspect-ratio:4/5;background:#E9E7E1;overflow:hidden;\">\n            <img src=\"c1d3df72-8718-49c1-8446-9edd402fa05c\" alt=\"Placeholder — treatment reference\" style=\"width:100%;height:100%;object-fit:cover;display:block;filter:contrast(0.92) brightness(1.04);\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">4:5 portrait<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Same crop, same treatment — the set must look like one shoot.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"aspect-ratio:4/5;background:#E9E7E1;overflow:hidden;\">\n            <img src=\"528e6e1a-0b72-497b-9c44-e0bb41e5a005\" alt=\"Placeholder — treatment reference\" style=\"width:100%;height:100%;object-fit:cover;display:block;filter:contrast(0.92) brightness(1.04);\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;\">\n            <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">4:5 portrait<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;color:#8A8880;\">Tighter subject. Carries a section break or a quiet page.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:1px;background:#DCDAD3;border:1px solid #DCDAD3;margin-bottom:clamp(32px,4vw,48px);\">\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Subjects to shoot<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:#3B3A36;\">\n          <div><strong style=\"font-weight:500;\">Workspace<\u002Fstrong> — desks mid-work; cables, coffee, screens on.<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">People<\u002Fstrong> — working, not posing. Backs, hands, profiles; no eye contact.<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">Detail<\u002Fstrong> — one object, close, flat light.<\u002Fdiv>\n          <div><strong style=\"font-weight:500;\">Place<\u002Fstrong> — the studio and the city it sits in, in plain weather.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;margin-top:8px;\">Treatment<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:#3B3A36;\">\n          <div>Greyscale, no exception — no split tone, no warm wash.<\u002Fdiv>\n          <div>Contrast 0.92, brightness 1.04 — flat, document-grade.<\u002Fdiv>\n          <div>Crops: 4:5, 3:2 or 1:1. No rounding, no drop shadow.<\u002Fdiv>\n          <div>Available light only. No flash, no bokeh backgrounds.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5F4F1;padding:clamp(22px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Never<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:#8A8880;\">\n          <div>Stock abstraction — glowing networks, circuit boards, handshakes.<\u002Fdiv>\n          <div>Screens composited with fake dashboards.<\u002Fdiv>\n          <div>Anyone smiling at the lens in a white-cyc studio.<\u002Fdiv>\n          <div>Colour, gradients or duotone of any kind.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,48%),1fr));gap:clamp(16px,2vw,26px);\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"position:relative;aspect-ratio:16/9;overflow:hidden;background:#111110;\">\n          <img src=\"328bec09-8470-40bd-abd9-0f9f09e2a127\" alt=\"Full-bleed opener\" style=\"width:100%;height:100%;object-fit:cover;display:block;filter:contrast(0.88) brightness(0.42);\">\n          <div style=\"position:absolute;inset:0;padding:clamp(20px,3vw,36px);display:flex;flex-direction:column;justify-content:space-between;\">\n            <span style=\"display:inline-flex;align-items:baseline;gap:3.4px;color:#F5F4F1;align-self:flex-start;\"><span style=\"font-size:17px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:3.4px;height:3.4px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan>\n            <span style=\"font-size:clamp(18px,2.4vw,30px);font-weight:500;letter-spacing:-0.035em;line-height:1.1;color:#F5F4F1;max-width:18ch;\">Less noise. Better software.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Type on image<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;padding:clamp(4px,1vw,12px) 0;\">\n        <div style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;\">Setting type over photography<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#3B3A36;\">Darken the image to 42% brightness and set paper type at full opacity — never a translucent scrim, never a gradient fade. If the copy still fights the image, the image is wrong.<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#3B3A36;\">One line of headline and the mark, nothing more. Body copy always sits on paper or ink, never on a photograph.<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#8A8880;\">Minimum contrast 4.5:1 against the darkest region the type crosses — check the light corner, not the average.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── 07 Applications ─────────────────────────────── -->\n  <section style=\"padding:clamp(56px,8vw,110px) 0;border-bottom:1px solid #DCDAD3;\">\n    <div style=\"display:flex;gap:14px;align-items:baseline;margin-bottom:clamp(28px,4vw,44px);\">\n      <span style=\"font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:0.14em;color:#8A8880;\">07<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:500;letter-spacing:-0.025em;\">Applications<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:clamp(20px,2.4vw,32px);\">\n\n      <!-- business card front -->\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"aspect-ratio:85/55;background:#111110;padding:22px;display:flex;flex-direction:column;justify-content:space-between;\">\n          <div><sc-if value=\"{{ showWord }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:baseline;gap:3.9px;color:#F5F4F1;\"><span style=\"font-size:14px;font-weight:500;letter-spacing:-0.035em;\">MINIMALIST<\u002Fspan><span style=\"width:2.8px;height:2.8px;background:currentColor;flex:none;\"><\u002Fspan><\u002Fspan><\u002Fsc-if><sc-if value=\"{{ markE }}\"><span style=\"width:96px;height:96px;background:#F5F4F1;color:#111110;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.8px;flex:none;\">
