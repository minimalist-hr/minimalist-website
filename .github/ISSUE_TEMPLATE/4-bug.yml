name: Bug
description: Something on the site that doesn't work as designed.
type: Bug
assignees: [mucnjakf]
projects: [minimalist-hr/2]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://minimalist.hr/hr/kontakt/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Safari 19, iPhone 15, light theme
