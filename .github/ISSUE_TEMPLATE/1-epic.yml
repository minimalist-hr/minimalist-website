name: Epic
description: A larger piece of work, split into stories and tasks.
type: Epic
assignees: [mucnjakf]
projects: [minimalist-hr/2]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      placeholder: Add a services page, so visitors see what the studio does before they write.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The outcome that closes the epic. Add its stories and tasks as sub-issues.
