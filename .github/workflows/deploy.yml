name: Deploy

# Pull requests already ran the checks, so a push only builds and deploys.
on:
  push:
    branches: [staging, main]

permissions:
  contents: read

env:
  WORKER_NAME: minimalist-website # must match "name" in wrangler.jsonc
  WRANGLER_SEND_METRICS: 'false'

jobs:
  # One staging preview, refreshed by every merge into staging. Uploads a Worker version under
  # the alias "staging" without touching production.
  staging:
    name: staging
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-${{ env.WORKER_NAME }}.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Keep the preview out of search engines
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
      - name: Upload the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$(printf '%s %s' "${GITHUB_SHA::7}" "${COMMIT_MESSAGE%%$'\n'*}" | cut -c1-90)"
          pnpm exec wrangler versions upload --preview-alias staging --message "$MSG"

  production:
    name: production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Keep production out of search engines unless indexing is allowed
        if: vars.ALLOW_INDEXING != 'true'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$(printf '%s %s' "${GITHUB_SHA::7}" "${COMMIT_MESSAGE%%$'\n'*}" | cut -c1-90)"
          pnpm exec wrangler deploy --message "$MSG"

  # Copies docs/wiki/ to the GitHub wiki once production is live. Runs on every release, so a
  # failed sync catches up next time.
  wiki:
    name: wiki
    needs: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wiki
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy docs/wiki to the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki
          rsync --archive --delete --exclude .git docs/wiki/ /tmp/wiki/
          cd /tmp/wiki
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "Sync wiki from ${GITHUB_SHA::7}"
          git push
